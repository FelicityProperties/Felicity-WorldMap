# Diagnostics only: fetches the given URLs from a GitHub runner and prints
# status, content type and the head of each body to the run log. Used to
# see a new upstream's real response before building on it — Vercel and
# the development sandbox cannot reach several of them (CLAUDE.md, live
# layers). Manual only; stores and pushes nothing.
name: probe
on:
  workflow_dispatch:
    inputs:
      targets:
        description: 'Whitespace-separated URLs, yahoo-crumb:SYM,SYM, or post:URL::BASE64BODY'
        required: true
      head:
        description: 'Characters of each body to print'
        required: false
        default: '3000'
      timeout:
        description: 'Per-request timeout, ms'
        required: false
        default: '15000'
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Probe
        env:
          PROBE_TARGETS: ${{ inputs.targets }}
          PROBE_HEAD: ${{ inputs.head }}
          PROBE_TIMEOUT: ${{ inputs.timeout }}
        run: node scripts/probe.mjs
